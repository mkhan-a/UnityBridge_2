<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnityBridge – Login</title>
  <link rel="stylesheet" href="css/Homepage.css">
  <script src="js/Homepage.js" defer></script>
</head>
<body>

  <div class="auth-wrapper">

    <div class="auth-brand">
      <h1>UnityBridge</h1>
      <p>Connecting neighbors through mutual aid and resource sharing.</p>
    </div>

    <div class="auth-form-panel">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Log in to your account to continue</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-submit">Log In</button>
      </form>

      <p class="auth-link">Don't have an account? <a href="SignUp.html">Sign up here</a></p>
    </div>

  </div>

</body>
</html>
